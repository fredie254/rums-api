; OPcache settings for RUMS API (PHP 8.1+)
; Copy to php.ini or drop into /etc/php/8.x/fpm/conf.d/ (or equivalent).
; Restart PHP-FPM after changes: systemctl restart php8.x-fpm

[opcache]
opcache.enable                  = 1
opcache.enable_cli              = 0         ; no need for CLI (artisan, composer)

; Memory — 128 MB holds most medium PHP codebases compiled.
; Increase to 256 MB if you add many services/endpoints.
opcache.memory_consumption      = 128
opcache.interned_strings_buffer = 16        ; MB for interned string deduplication
opcache.max_accelerated_files   = 4000      ; max files to cache (default 2000 is often too low)

; Revalidation — check for file changes every 60 s in production.
; Set opcache.validate_timestamps = 0 for maximum performance once code is stable,
; but then you MUST run `kill -USR2 <fpm_master_pid>` after deploys.
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 60

; JIT (PHP 8+) — trampoline mode is safe for most web apps.
; Set to 0 to disable if you hit JIT-related bugs.
opcache.jit                     = trampoline
opcache.jit_buffer_size         = 64M

; Misc
opcache.fast_shutdown           = 1
opcache.save_comments           = 0         ; strip docblock comments from cache (smaller cache)
opcache.huge_code_pages         = 1         ; use 2MB TLB pages where available (Linux)
